name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  verify:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_GOOGLE_SERVICES_JSON_STAGING: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_STAGING }}
        run: ./scripts/configure-firebase.sh
      - name: Restore Gradle wrapper permission
        run: chmod +x gradlew
      # Only the staging variant is configured for debug builds: the production
      # Firebase file registers the release package alone, so a production
      # debug build has no matching client.
      - name: Unit tests
        run: ./gradlew testStagingDebugUnitTest
      - name: Lint
        run: ./gradlew lintStagingDebug --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartie-verify-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firestore/package-lock.json
      - name: Install rules test dependencies
        working-directory: firestore
        run: npm ci --no-audit --no-fund
      - name: Run the section 7 permission matrix against the emulator
        working-directory: firestore
        run: npx firebase emulators:exec --only firestore "npm test"

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_GOOGLE_SERVICES_JSON_STAGING: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_STAGING }}
        run: ./scripts/configure-firebase.sh
      - name: Restore Gradle wrapper permission
        run: chmod +x gradlew
      - name: Configure signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
          ANDROID_STAGING_KEYSTORE_BASE64: ${{ secrets.ANDROID_STAGING_KEYSTORE_BASE64 }}
          ANDROID_STAGING_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_STAGING_KEYSTORE_PASSWORD }}
        run: ./scripts/configure-signing.sh
      - name: Build staging debug APK
        run: ./gradlew assembleStagingDebug --stacktrace
      # Reads the certificate out of the APK itself, so it reports what actually
      # signed the artifact rather than what was meant to. Certificate
      # fingerprints are public; no key material or password is printed.
      - name: Report the staging APK certificate
        env:
          STAGING_KEY_CONFIGURED: ${{ steps.signing.outputs.staging_available }}
        run: ./scripts/print-apk-certificate.sh app/build/outputs/apk/staging/debug/app-staging-debug.apk
      - name: Build signed production APK (main only)
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.release_available == 'true'
        run: ./gradlew assembleProductionRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: smartie-native-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
