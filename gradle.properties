org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
# Reuse task outputs whose inputs have not changed, instead of recompiling and
# re-running them. The suite costs roughly five minutes on CI because
# `forkEvery(1)` starts a fresh JVM for each of the test classes — the right
# trade for Robolectric, and unchanged here — so the saving worth having is
# skipping the run altogether when nothing it depends on moved. A
# documentation-only commit is the obvious case.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# SMARTIE build settings (non-secret; override locally or with -P flags).
# The primary Owner email is only a transition fallback: once
# teamSettings/access.primaryOwnerUid is seeded, the uid wins.
smartie.primaryOwnerEmail=khan4mudassir1980@gmail.com
