name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Use placeholder Firebase configuration for source checks
        run: cp app/google-services.placeholder.json app/google-services.json
      - name: Restore Gradle wrapper permission
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: smartie-native-apks
          path: app/build/outputs/apk/**/*.apk
