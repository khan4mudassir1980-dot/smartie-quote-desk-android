name: Android build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'claude/**'

jobs:
  verify:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_GOOGLE_SERVICES_JSON_STAGING: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_STAGING }}
        run: ./scripts/configure-firebase.sh
      - name: Restore Gradle wrapper permission
        run: chmod +x gradlew
      # Only the staging variant is configured for debug builds: the production
      # Firebase file registers the release package alone, so a production
      # debug build has no matching client.
      - name: Unit tests
        run: ./gradlew testStagingDebugUnitTest
      - name: Lint
        run: ./gradlew lintStagingDebug --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartie-verify-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: firestore/package-lock.json
      - name: Install rules test dependencies
        working-directory: firestore
        run: npm ci --no-audit --no-fund
      - name: Run the section 7 permission matrix against the emulator
        working-directory: firestore
        run: npx firebase emulators:exec --only firestore "npm test"

  build:
    name: Build APKs
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Firebase
        env:
          FIREBASE_GOOGLE_SERVICES_JSON: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}
          FIREBASE_GOOGLE_SERVICES_JSON_STAGING: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_STAGING }}
        run: ./scripts/configure-firebase.sh
      - name: Restore Gradle wrapper permission
        run: chmod +x gradlew
      - name: Configure release signing
        id: signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_SIGNING_PASSWORD" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > smartie-quote-desk-release.p12
            {
              echo "storeFile=smartie-quote-desk-release.p12"
              echo "storePassword=$ANDROID_SIGNING_PASSWORD"
              echo "keyAlias=smartie-quote-desk"
              echo "keyPassword=$ANDROID_SIGNING_PASSWORD"
              echo "storeType=PKCS12"
            } > keystore.properties
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build staging debug APK
        run: ./gradlew assembleStagingDebug --stacktrace
      - name: Build signed production APK (main only)
        if: github.ref == 'refs/heads/main' && steps.signing.outputs.available == 'true'
        run: ./gradlew assembleProductionRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: smartie-native-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
